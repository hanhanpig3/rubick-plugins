<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>备忘快贴</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f2329;
    --text-sub: #8a919f;
    --border: #e8eaf0;
    --primary: #ffb300;
    --primary-soft: #fff4d6;
    --danger: #ef4f4f;
    --danger-soft: #ffecec;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #252533;
      --text: #e8eaf0;
      --text-sub: #9aa1ad;
      --border: #38384a;
      --primary-soft: #3a3420;
      --danger-soft: #3a2525;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }
  .view { display: none; flex-direction: column; height: 100%; }
  .view.active { display: flex; }
  /* header */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px 10px;
  }
  .logo {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: linear-gradient(135deg, #ffc53d, #fa8c16);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    flex: none;
    box-shadow: 0 2px 6px rgba(250, 140, 22, .35);
  }
  .header h1 { font-size: 16px; font-weight: 600; letter-spacing: .5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .header .count {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-sub);
    background: var(--border);
    padding: 2px 9px;
    border-radius: 999px;
    flex: none;
  }
  /* search bar */
  .search-bar { padding: 4px 18px 12px; }
  .search-bar input {
    width: 100%;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text);
    padding: 0 12px;
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  .search-bar input:focus { border-color: var(--primary); }
  .search-bar input::placeholder { color: var(--text-sub); }
  /* list */
  .list { flex: 1; overflow-y: auto; padding: 0 18px 12px; }
  .list::-webkit-scrollbar, .detail-body::-webkit-scrollbar, .edit-area-wrap::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb, .detail-body::-webkit-scrollbar-thumb, .edit-area-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60%;
    color: var(--text-sub);
    gap: 8px;
  }
  .empty .big { font-size: 40px; opacity: .45; }
  .item {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 10px;
    transition: box-shadow .15s, border-color .15s;
    position: relative;
    cursor: pointer;
  }
  .item:hover {
    border-color: var(--primary);
    box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
  }
  .item .content {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.55;
    padding-right: 64px;
    max-height: 90px;
    overflow: hidden;
  }
  .item .meta {
    display: flex;
    align-items: center;
    margin-top: 8px;
    gap: 8px;
  }
  .item .time { font-size: 11px; color: var(--text-sub); }
  .item .id { font-size: 10px; color: var(--text-sub); opacity: .6; }
  .item .actions {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 6px;
  }
  .btn {
    border: none;
    cursor: pointer;
    font-size: 12px;
    border-radius: 7px;
    padding: 4px 10px;
    transition: filter .15s;
  }
  .btn:active { transform: scale(.95); }
  .btn-ghost { background: transparent; color: var(--text-sub); border: 1px solid var(--border); }
  .btn-copy { background: var(--primary-soft); color: #b26a00; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .btn-copy { color: #ffc53d; }
  }
  .btn-copy:hover { filter: brightness(.97); }
  .btn-del { background: var(--danger-soft); color: var(--danger); }
  .btn-del:hover { filter: brightness(.97); }
  .btn-clear { background: transparent; color: var(--text-sub); border: 1px solid var(--border); }
  /* footer */
  .footer {
    padding: 8px 18px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .footer .add-row { flex: 1; display: flex; gap: 8px; }
  .footer input, .edit-area-controls input {
    flex: 1;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text);
    padding: 0 12px;
    font-size: 13px;
    outline: none;
  }
  .footer input:focus, .edit-area-controls input:focus { border-color: var(--primary); }
  .btn-add {
    background: linear-gradient(135deg, #ffc53d, #fa8c16);
    color: #fff;
    font-weight: 600;
    height: 34px;
    padding: 0 16px;
    box-shadow: 0 2px 6px rgba(250, 140, 22, .3);
  }
  .hint { font-size: 11px; color: var(--text-sub); white-space: nowrap; flex: none; }
  @media (max-width: 560px) { .hint { display: none; } }
  /* ---- detail view ---- */
  .detail-body { flex: 1; overflow-y: auto; padding: 4px 18px 14px; }
  .detail-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 18px 10px;
  }
  .detail-title-flex {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .detail-date { font-size: 12px; color: var(--text-sub); }
  .para {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: box-shadow .15s, border-color .15s, background .15s;
    position: relative;
  }
  .para:hover {
    border-color: var(--primary);
    background: var(--primary-soft);
  }
  .para .para-text {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
    font-size: 15px;
    padding-right: 10px;
  }
  .para .para-copy {
    position: absolute;
    right: 8px;
    top: 8px;
    opacity: 0;
    transition: opacity .15s;
    padding: 3px 9px;
  }
  .para:hover .para-copy { opacity: 1; }
  .para .para-num { font-size: 10px; color: var(--text-sub); opacity: .7; }
  /* ---- edit view ---- */
  .edit-pane { flex: 1; display: flex; flex-direction: column; padding: 4px 18px 0; min-height: 0; }
  .edit-area-wrap { flex: 1; min-height: 0; overflow-y: auto; }
  .edit-area-wrap textarea {
    width: 100%;
    height: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text);
    padding: 12px;
    font-size: 15px;
    line-height: 1.6;
    resize: none;
    outline: none;
    font-family: inherit;
  }
  .edit-area-wrap textarea:focus { border-color: var(--primary); }
  .edit-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0 14px;
    border-top: 1px solid var(--border);
    margin-top: 10px;
  }
  .edit-bar .hint-edit { font-size: 11px; color: var(--text-sub); flex: 1; }
</style>
</head>
<body>
  <div class="app">

    <!-- ================= LIST VIEW ================= -->
    <div class="view active" id="viewList">
      <div class="header">
        <div class="logo">📌</div>
        <h1>备忘快贴</h1>
        <span class="count" id="count">0 条</span>
      </div>
      <div class="search-bar">
        <input id="search" type="text" placeholder="🔍 搜索备忘内容…" autocomplete="off" />
      </div>
      <div class="list" id="list"></div>
      <div class="footer">
        <div class="add-row">
          <input id="addInput" type="text" placeholder="✍️ 输入备忘内容，回车保存" autocomplete="off" />
          <button class="btn btn-add" id="addBtn">添加</button>
        </div>
        <button class="btn btn-del" id="clearBtn" title="清空全部备忘">清空</button>
        <span class="hint">Ctrl+N 新建 · 点击条目放大</span>
      </div>
    </div>

    <!-- ================= DETAIL VIEW ================= -->
    <div class="view" id="viewDetail">
      <div class="header">
        <button class="btn btn-ghost" id="backBtn">← 返回</button>
        <div class="detail-title-flex">
          <h1 class="detail-title" id="detailTitle">备忘详情</h1>
          <span class="detail-date" id="detailDate"></span>
        </div>
        <span class="count" id="detailCount"></span>
      </div>
      <div class="detail-head">
        <span class="hint">👇 点任意一段即可复制</span>
        <span style="flex:1"></span>
        <button class="btn btn-copy" id="copyAllBtn">复制整条</button>
        <button class="btn btn-ghost" id="editBtn">编辑</button>
        <button class="btn btn-del" id="delBtn">删除</button>
      </div>
      <div class="detail-body" id="detailBody"></div>
    </div>

    <!-- ================= EDIT VIEW ================= -->
    <div class="view" id="viewEdit">
      <div class="header">
        <button class="btn btn-ghost" id="editBackBtn">← 退出</button>
        <h1 class="detail-title" id="editTitle">新建备忘</h1>
        <span class="count" style="margin-left:auto">编辑中</span>
      </div>
      <div class="edit-pane">
        <div class="edit-area-wrap">
          <textarea id="editArea" placeholder="✍️ 输入备忘内容…"></textarea>
        </div>
        <div class="edit-bar">
          <span class="hint-edit">Ctrl+S 保存 · Esc 退出（放弃修改）</span>
          <button class="btn btn-add" id="saveBtn">保存 (Ctrl+S)</button>
        </div>
      </div>
    </div>

  </div>

<script>
(function () {
  'use strict';

  var STORE_KEY = 'memo-list';
  var memos = [];
  var state = 'list';          // list | detail | edit
  var currentDetailId = null;  // memo id shown in detail
  var editingId = null;        // memo id being edited, null = new memo
  var currentCode = 'memos';

  function hasRubick() {
    return typeof window.rubick !== 'undefined' && window.rubick;
  }

  function storageGet() {
    var data = null;
    if (hasRubick() && window.rubick.dbStorage && window.rubick.dbStorage.getItem) {
      try {
        data = window.rubick.dbStorage.getItem(STORE_KEY);
      } catch (e) {
        data = null;
      }
    }
    if (data == null) {
      try {
        var raw = localStorage.getItem(STORE_KEY);
        data = raw ? JSON.parse(raw) : null;
      } catch (e) {
        data = null;
      }
    }
    if (data && Array.isArray(data.list)) return data.list;
    if (Array.isArray(data)) return data;
    return [];
  }

  function storageSet(arr) {
    var data = { list: arr };
    if (hasRubick() && window.rubick.dbStorage && window.rubick.dbStorage.setItem) {
      try {
        window.rubick.dbStorage.setItem(STORE_KEY, data);
        localStorage.setItem(STORE_KEY, JSON.stringify(data));
        return;
      } catch (e) {
        // fallthrough
      }
    }
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    } catch (e) {
      // ignore
    }
  }

  function load() {
    memos = storageGet();
  }

  function save() {
    storageSet(memos);
  }

  function findMemo(id) {
    for (var i = 0; i < memos.length; i++) {
      if (memos[i].id === id) return memos[i];
    }
    return null;
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function fmtTime(ts) {
    if (!ts) return '';
    var diff = Date.now() - ts;
    if (diff < 60 * 1000) return '刚刚';
    if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + ' 分钟前';
    if (diff < 24 * 60 * 60 * 1000) return Math.floor(diff / 3600000) + ' 小时前';
    if (diff < 7 * 24 * 60 * 60 * 1000) return Math.floor(diff / 86400000) + ' 天前';
    var d = new Date(ts);
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  // 把内容按（手动）换行拆成段落
  function getParagraphs(content) {
    return String(content == null ? '' : content)
      .split(/\r?\n/)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }

  /* ---------------- sub-input (rubick 搜索框) ---------------- */
  function onSubInputChange(data) {
    var text = (data && (data.text || '')) || '';
    document.getElementById('search').value = text;
    if (state === 'list') renderList();
  }
  function setupSubInput() {
    if (!hasRubick() || !window.rubick.setSubInput) return;
    window.rubick.setSubInput(onSubInputChange, '搜索备忘内容…');
  }
  function clearSubInput() {
    if (!hasRubick() || !window.rubick.removeSubInput) return;
    window.rubick.removeSubInput();
  }

  /* ---------------- view switching ---------------- */
  function showView(name) {
    state = name;
    ['viewList', 'viewDetail', 'viewEdit'].forEach(function (id) {
      document.getElementById(id).classList.toggle('active', id === 'view' + name[0].toUpperCase() + name.slice(1));
    });
    if (name === 'list') setupSubInput();
    else clearSubInput();
  }

  /* ---------------- list ---------------- */
  function renderList() {
    var listEl = document.getElementById('list');
    var keyword = (document.getElementById('search').value || '').trim().toLowerCase();
    var filtered = memos;
    if (keyword) {
      filtered = memos.filter(function (m) {
        return (m.content || '').toLowerCase().indexOf(keyword) >= 0;
      });
    }
    document.getElementById('count').textContent = memos.length + ' 条';
    if (!memos.length) {
      listEl.innerHTML =
        '<div class="empty"><div class="big">📌</div><div>还没有备忘</div>' +
        '<div>按 Ctrl+N 新建一条，或在下方输入后回车保存</div></div>';
      return;
    }
    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty"><div class="big">🔍</div><div>没有匹配「' + escapeHtml(keyword) + '」的备忘</div></div>';
      return;
    }
    var html = '';
    filtered.forEach(function (m) {
      var lineCount = (m.content.match(/\n/g) || []).length;
      var num = getParagraphs(m.content).length;
      html +=
        '<div class="item" data-id="' + encodeURIComponent(m.id) + '">' +
        '  <div class="actions">' +
        '    <button class="btn btn-copy" data-action="copy" data-id="' + encodeURIComponent(m.id) + '">复制</button>' +
        '    <button class="btn btn-del" data-action="del" data-id="' + encodeURIComponent(m.id) + '" title="删除">删除</button>' +
        '  </div>' +
        '  <div class="content">' + escapeHtml(m.content) + '</div>' +
        '  <div class="meta">' +
        '    <span class="time">' + fmtTime(m.updatedAt || m.ts) + '</span>' +
        '    <span class="id">' + num + ' 段' + (lineCount > 0 ? ' · ↑ 点击放大' : '') + '</span>' +
        '  </div>' +
        '</div>';
    });
    listEl.innerHTML = html;
  }

  function addMemo(content) {
    content = String(content == null ? '' : content).trim();
    if (!content) {
      notify('备忘内容不能为空');
      return null;
    }
    var memo = {
      id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      content: content,
      ts: Date.now(),
      updatedAt: Date.now(),
    };
    memos.unshift(memo);
    save();
    return memo;
  }

  function updateMemo(id, content) {
    content = String(content == null ? '' : content).trim();
    var memo = findMemo(id);
    if (!memo) return false;
    if (!content) {
      notify('备忘内容不能为空');
      return false;
    }
    memo.content = content;
    memo.updatedAt = Date.now();
    save();
    return true;
  }

  function removeMemo(id) {
    memos = memos.filter(function (m) { return m.id !== id; });
    save();
    if (currentDetailId === id) currentDetailId = null;
  }

  function clearAll() {
    if (!memos.length) return;
    memos = [];
    currentDetailId = null;
    save();
    notify('已清空备忘');
    renderList();
  }

  function copyTextToClipboard(content) {
    content = String(content == null ? '' : content);
    if (!content) return;
    if (typeof window.copyText === 'function') {
      window.copyText(content);
    } else if (hasRubick() && window.rubick.copyText) {
      window.rubick.copyText(content);
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(content).catch(function () {});
    }
    notify('已复制：' + content.slice(0, 20) + (content.length > 20 ? '…' : ''));
  }

  function copyAndHide(content) {
    copyTextToClipboard(content);
    if (hasRubick() && window.rubick.hideMainWindow) {
      window.rubick.hideMainWindow();
    }
  }

  function notify(msg) {
    if (hasRubick() && window.rubick.showNotification) {
      window.rubick.showNotification(msg);
    }
  }

  function pasteLatest() {
    if (!memos.length) {
      notify('还没有备忘可以复制');
      return;
    }
    copyAndHide(memos[0].content);
  }

  /* ---------------- detail ---------------- */
  function openDetail(id) {
    var memo = findMemo(id);
    if (!memo) return;
    currentDetailId = id;
    document.getElementById('detailTitle').textContent = '备忘详情';
    document.getElementById('detailDate').textContent = fmtTime(memo.updatedAt || memo.ts);
    document.getElementById('detailCount').textContent = memos.length + ' 条';
    var paras = getParagraphs(memo.content);
    var body = document.getElementById('detailBody');
    if (!paras.length) {
      body.innerHTML = '<div class="empty"><div class="big">📄</div><div>这条备忘是空的</div></div>';
    } else {
      var html = '';
      paras.forEach(function (p, i) {
        html +=
          '<div class="para" data-i="' + i + '" title="点击复制该段">' +
          '  <button class="btn btn-copy para-copy" data-i="' + i + '">复制这段</button>' +
          '  <div class="para-num">第 ' + (i + 1) + ' 段</div>' +
          '  <div class="para-text">' + escapeHtml(p) + '</div>' +
          '</div>';
      });
      body.innerHTML = html;
    }
    showView('detail');
  }

  function copyParagraph(i) {
    var memo = findMemo(currentDetailId);
    if (!memo) return;
    var paras = getParagraphs(memo.content);
    if (!paras[i]) return;
    copyAndHide(paras[i]);
  }

  /* ---------------- edit ---------------- */
  function startNewMemo() {
    editingId = null;
    document.getElementById('editTitle').textContent = '新建备忘';
    var area = document.getElementById('editArea');
    area.value = '';
    showView('edit');
    setTimeout(function () { area.focus(); }, 60);
  }

  function openEdit(id) {
    var memo = findMemo(id);
    if (!memo) return;
    editingId = memo.id;
    document.getElementById('editTitle').textContent = '编辑备忘';
    var area = document.getElementById('editArea');
    area.value = memo.content;
    showView('edit');
    setTimeout(function () { area.focus(); area.setSelectionRange(area.value.length, area.value.length); }, 60);
  }

  function saveEdit() {
    var text = document.getElementById('editArea').value.trim();
    if (!text) {
      notify('备忘内容不能为空');
      return;
    }
    if (editingId === null) {
      var memo = addMemo(text);
      if (memo) {
        notify('已添加备忘');
        openDetail(memo.id);
      }
    } else {
      if (updateMemo(editingId, text)) {
        notify('已保存');
        openDetail(editingId);
      }
    }
  }

  function exitEdit() {
    if (state !== 'edit') return;
    if (editingId === null) {
      renderList();
      showView('list');
    } else {
      openDetail(editingId);
    }
  }

  /* ---------------- keyboard shortcuts ---------------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && (e.key === 'n' || e.key === 'N')) {
      e.preventDefault();
      startNewMemo();
      return;
    }
    if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      if (state === 'edit') saveEdit();
      return;
    }
    if (e.key === 'Escape') {
      if (state === 'edit') {
        e.preventDefault();
        exitEdit();
        return;
      }
      if (state === 'detail') {
        e.preventDefault();
        backToList();
        return;
      }
      // list：交给 rubick 主窗口处理（隐藏/退出）
    }
  });

  function backToList() {
    currentDetailId = null;
    renderList();
    showView('list');
    focusAddInput();
  }

  function focusAddInput() {
    var el = document.getElementById('addInput');
    setTimeout(function () { el.focus(); }, 60);
  }

  /* ---------------- events ---------------- */
  function bindEvents() {
    document.getElementById('addBtn').addEventListener('click', function () {
      var el = document.getElementById('addInput');
      addMemo(el.value);
      el.value = '';
      renderList();
      focusAddInput();
    });
    document.getElementById('addInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var val = this.value;
        this.value = '';
        if (addMemo(val)) renderList();
      }
    });
    document.getElementById('search').addEventListener('input', function () {
      renderList();
    });
    document.getElementById('clearBtn').addEventListener('click', function () {
      if (this.dataset.armed) {
        delete this.dataset.armed;
        this.textContent = '清空';
        clearAll();
        return;
      }
      if (!memos.length) return;
      this.dataset.armed = '1';
      this.textContent = '确认清空?';
      var self = this;
      setTimeout(function () {
        if (self.dataset.armed) {
          delete self.dataset.armed;
          self.textContent = '清空';
        }
      }, 2500);
    });
    // list click 委托
    document.getElementById('list').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (btn) {
        var id = decodeURIComponent(btn.getAttribute('data-id'));
        var action = btn.getAttribute('data-action');
        var target = findMemo(id);
        if (!target) return;
        if (action === 'copy') {
          copyAndHide(target.content);
        } else if (action === 'del') {
          removeMemo(id);
          renderList();
        }
        return;
      }
      var item = e.target.closest('.item[data-id]');
      if (item) {
        openDetail(decodeURIComponent(item.getAttribute('data-id')));
      }
    });
    // detail
    document.getElementById('backBtn').addEventListener('click', backToList);
    document.getElementById('copyAllBtn').addEventListener('click', function () {
      var memo = findMemo(currentDetailId);
      if (memo) copyAndHide(memo.content);
    });
    document.getElementById('editBtn').addEventListener('click', function () {
      if (currentDetailId) openEdit(currentDetailId);
    });
    document.getElementById('delBtn').addEventListener('click', function () {
      if (!currentDetailId) return;
      removeMemo(currentDetailId);
      notify('已删除');
      backToList();
    });
    document.getElementById('detailBody').addEventListener('click', function (e) {
      var iAttr = e.target.closest('.para') && e.target.closest('.para').getAttribute('data-i');
      if (iAttr != null) copyParagraph(parseInt(iAttr, 10));
    });
    // edit
    document.getElementById('editBackBtn').addEventListener('click', exitEdit);
    document.getElementById('saveBtn').addEventListener('click', saveEdit);
    document.getElementById('editArea').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        saveEdit();
      }
    });
  }

  function bindRubickHooks() {
    if (!hasRubick()) return;
    if (window.rubick.onPluginEnter) {
      window.rubick.onPluginEnter(function (data) {
        data = data || {};
        currentCode = data.code || 'memos';
        if (currentCode === 'add') {
          var text = String(data.payload == null ? '' : data.payload)
            .replace(/^添加备忘\s*/i, '')
            .trim();
          if (text) {
            addMemo(text);
            notify('已添加备忘');
          }
          renderList();
          showView('list');
          return;
        }
        if (currentCode === 'paste') {
          pasteLatest();
          return;
        }
        // memos 默认进入列表
        document.getElementById('search').value = '';
        document.getElementById('addInput').value = '';
        currentDetailId = null;
        renderList();
        showView('list');
        focusAddInput();
      });
    }
    if (window.rubick.onPluginOut) {
      window.rubick.onPluginOut(function () {
        clearSubInput();
      });
    }
    if (window.rubick.onPluginReady) {
      window.rubick.onPluginReady(function () {
        try { window.rubick.setExpendHeight(560); } catch (e) {}
      });
    }
  }

  function init() {
    load();
    bindEvents();
    bindRubickHooks();
    renderList();
    showView('list');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
